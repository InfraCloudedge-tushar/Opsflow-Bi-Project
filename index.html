<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var d = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (d && d.configurable && d.get && !d.set) {
            Object.defineProperty(window, 'fetch', {
              get: d.get,
              set: function () {},
              enumerable: d.enumerable,
              configurable: true,
            });
          }
        } catch (_) {}
        window.addEventListener(
          'error',
          function (e) {
            var src = (e && e.filename) || '';
            var stack = (e && e.error && e.error.stack) || '';
            if (src.indexOf('chrome-extension://') === 0 || stack.indexOf('chrome-extension://') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
